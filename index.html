<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="S1 Convention Hall — weddings, celebrations and corporate events in Ongole.">
  <title>S1 Convention Hall | Luxury Event & Wedding Venue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div data-component="navbar"></div>
  <main>
    <div data-component="hero"></div>
    <div data-component="events"></div>
    <div data-component="about"></div>
    <div data-component="gallery"></div>
    <div data-component="stats"></div>
    <div data-component="contact"></div>
  </main>
  <div data-component="footer"></div>
  <p id="componentError" role="alert" hidden style="padding:1rem;text-align:center">Some page sections could not load. Please run this website using a local server.</p>
  <script>
    // Static HTML component loader — no framework required.
    (async function loadComponents() {
      const names = ['navbar', 'hero', 'events', 'about', 'gallery', 'stats', 'contact', 'footer'];
      try {
        await Promise.all(names.map(async (name) => {
          const response = await fetch(`components/${name}.html`);
          if (!response.ok) throw new Error(`Could not load components/${name}.html`);
          const html = await response.text();
          document.querySelector(`[data-component="${name}"]`).innerHTML = html;
        }));
        const script = document.createElement('script');
        script.src = 'script.js';
        script.onload = () => initializeSite();
        document.body.appendChild(script);
      } catch (error) {
        console.error(error);
        document.getElementById('componentError').hidden = false;
      }
    })();
  </script>
</body>
</html>
